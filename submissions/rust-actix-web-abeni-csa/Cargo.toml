[package]
name = "rust-actix-web-abeni-csa"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.16.0", default-features = false, features = [
  "macros",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.3", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
sonic-rs = "0.5.10"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }

serde_json = "1.0.154"
once_cell = "1.21.4"

[profile.release]

opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
