# The whole server. start.sh fills in __LISTEN__ (HOST:PORT) and __ROOT__ (this folder).
worker_processes 1;            # 1 vCPU: one event loop, and SQLite writes never contend for locks
worker_rlimit_nofile 65535;    # the service's LimitNOFILE: every keep-alive client holds one fd
daemon off;
pid nginx.pid;
error_log stderr warn;
pcre_jit on;

env SQLITE_PATH;
env JWT_SECRET;

events {
    worker_connections 65000;  # leaves room under 65535 for the listener, db files and stderr
    multi_accept on;
}

http {
    access_log off;
    server_tokens off;
    default_type application/json;

    keepalive_timeout 75s;     # the load test's longest idle gap is ~15 s; behind Nginx needs >= 65 s
    keepalive_requests 1000000;
    reset_timedout_connection on;
    tcp_nodelay on;

    client_max_body_size 16k;
    client_body_buffer_size 16k;  # == max size, so request bodies always stay in memory
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    lua_package_path "__ROOT__/lua/?.lua;;";

    init_by_lua_block { require "app" }
    init_worker_by_lua_block { require("app").init_worker() }

    server {
        listen __LISTEN__ backlog=4096;

        location / {
            content_by_lua_block { require("app").handle() }
        }
    }
}
