micronaut.application.name=twelve-dollar-micronaut
micronaut.server.host=${HOST:127.0.0.1}
micronaut.server.port=${PORT:3000}
micronaut.server.thread-selection=MANUAL
micronaut.server.idle-timeout=75s
micronaut.server.max-request-size=16KB
micronaut.server.netty.parent.num-threads=1
micronaut.netty.event-loops.default.num-threads=1
micronaut.server.netty.parent.transport=nio
micronaut.netty.event-loops.default.transport=nio
# Response compression is optional; keep CPU available for SQLite and signature verification.
micronaut.server.netty.compression-threshold=-1
