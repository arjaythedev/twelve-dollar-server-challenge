feed.sqlite-path=${SQLITE_PATH}
feed.jwt-secret=${JWT_SECRET}

# One event loop per CPU (start.sh sets it from nproc).
quarkus.vertx.event-loops-pool-size=1
quarkus.vertx.prefer-native-transport=true

# SPEC.md: keep idle connections at least 65 s.
quarkus.http.idle-timeout=90s
quarkus.http.accept-backlog=4096
quarkus.http.http2=false
# Otherwise Quarkus rejects non-localhost Host headers when bound to 127.0.0.1.
quarkus.http.host-validation.require-localhost=false
# Bodies up to this size get a Content-Length instead of chunking; covers the largest feed.
quarkus.rest.output-buffer-size=16384
# 413 for big bodies before they are parsed on the event loop.
quarkus.http.limits.max-body-size=16K

quarkus.banner.enabled=false
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1}] %s%e%n
