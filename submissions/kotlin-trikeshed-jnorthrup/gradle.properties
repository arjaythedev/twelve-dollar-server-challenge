# Build box: 1 vCPU, 2 GB RAM, no swap. One Gradle JVM, the Kotlin compiler in-process.
org.gradle.jvmargs=-Xms600m -Xmx600m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.enableCInteropCommonization.nowarn=true
