[package]
name = "sqlite-btree"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bounds-checked SQLite record/varint decoding and a pure-Rust read-only B-tree/WAL reader over mmap"
categories = ["database", "encoding", "no-std"]

# Decoders are `no_std` pure core. The mmap reader (`reader` feature, default)
# pulls std + memmap2 and is Linux/64-bit by declaration (L1 substrate).
[features]
default = ["reader"]
reader = ["dep:memmap2"]

[dependencies]
memmap2 = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
rusqlite.workspace = true
