[package]
name = "twelve-dollar-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["http1", "server-graceful", "service", "tokio"] }
libc = "=0.2.190"
mio = { version = "=1.2.4", default-features = false, features = ["os-poll", "os-ext"] }
http-body-util = "=0.1.5"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tikv-jemallocator = { version = "=0.7.0", features = ["background_threads"] }
tower = { version = "=0.5.3", features = ["make", "util"] }

[patch.crates-io]
hyper = { git = "https://github.com/mjc/hyper.git", rev = "aaf16f787d264aa967e357b07a5781f593d5f230" }
tokio = { git = "https://github.com/mjc/tokio.git", rev = "30fa5746845ea20c8908134ee72ac6f43ecc76ac" }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
debug = false          # No debug symbols for smaller binaries
strip = true           # Strip symbols for even smaller size
lto = "fat"            # Optimize across the entire program
codegen-units = 1      # Single codegen unit for better optimization
overflow-checks = true # Keep overflow checks for safety with untrusted network data

[profile.profiling]
inherits = "release"
debug = 2              # Full DWARF debuginfo for accurate flamegraphs
strip = false
