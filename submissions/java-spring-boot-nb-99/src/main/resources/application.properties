server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
# Serving directly means one keep-alive connection per client. The cap bounds the
# heap held by per-connection buffers and stays below the VPS's 65,535 open files.
server.tomcat.max-connections=60000
server.tomcat.accept-count=4096
server.tomcat.keep-alive-timeout=70s
spring.web.resources.add-mappings=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.main.banner-mode=off
