[project]
name = "twelve-dollar-baseline"
version = "0.1.0"
description = "Typed Python reference implementation for the twelve-dollar server challenge"
requires-python = ">=3.15,<3.16"
dependencies = ["granian==2.8.4", "click==8.3.1", "orjson==3.13.0"]

[dependency-groups]
dev = [
    "msgspec==0.22.0",
    "psutil==7.2.2",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "types-psutil==7.2.2.20260906",
]

[tool.uv]
package = false
required-version = "==0.13.6"
link-mode = "copy"

[tool.pyright]
include = ["."]
exclude = [".venv", ".native", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN", "B", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"checks/**/*.py" = ["S101"]
"checks/test_json.py" = ["S311"]
# Local tools run without a shell; the fixed /tmp path belongs to a disposable container.
"dev.py" = ["S603", "S607", "S108"]
# The build uses a fixed HTTPS URL, verifies the archive and runs the selected compiler directly.
"native/build.py" = ["S310", "S603"]
# Fixed SQL fragments and a reproducible timing order, never request input or cryptography.
"encoding_bench.py" = ["S311", "S608"]

[tool.ruff.format]
line-ending = "lf"
