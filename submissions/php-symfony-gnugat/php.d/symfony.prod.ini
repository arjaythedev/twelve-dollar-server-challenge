; FrankenPHP's release binary loads no php.ini: start.sh adds this folder to PHP_INI_SCAN_DIR.

; php.ini-production's settings that differ from PHP's built-in defaults (assertions would run, errors be displayed)
zend.assertions=-1
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED
zend.exception_ignore_args=On
zend.exception_string_param_max_len=0
variables_order="GPCS"
request_order="GP"
output_buffering=4096
short_open_tag=Off
enable_dl=Off
max_execution_time=30
max_input_time=60

; Production settings from the "Scaling PHP" workshop (github.com/dragoonis/symfonycon-2025-scaling, symfony.prod.ini)
; and Symfony's performance checklist (symfony.com/doc/current/performance.html).

; Don't check every file for a Unicode BOM
zend.detect_unicode=0

; Never check if PHP files changed: deploys rebuild the cache and restart the server
opcache.validate_timestamps=0
; A prime number above the app's file count (3,593)
opcache.max_accelerated_files=16087
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
; Answer file_exists(), is_file() and is_readable() from OPcache for cached files
opcache.enable_file_override=1

; realpath_cache_size is already 4096K by default
realpath_cache_ttl=600

; Load Symfony's preload list (the container's classes) once, at server start, into shared memory
opcache.preload=${APP_DIR}/config/preload.php

; JIT: compile hot code paths to machine code (the 64 MB buffer is already the default)
opcache.jit=tracing
