<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- the board -->
  <rect x="20" y="20" width="920" height="560" rx="10" fill="#f4f7f2" stroke="#4a6b3a" stroke-width="2"/>
  <text x="36" y="46" font-size="16" font-weight="bold" fill="#2f4a24">The board: board.cir, one ngspice 42 process (XSPICE)</text>

  <!-- outside world -->
  <rect x="40" y="250" width="110" height="70" rx="6" fill="#ffffff" stroke="#777"/>
  <text x="95" y="278" text-anchor="middle" font-weight="bold">nginx</text>
  <text x="95" y="296" text-anchor="middle" font-size="11">127.0.0.1:3000</text>
  <text x="95" y="310" text-anchor="middle" font-size="11">keep-alive</text>

  <!-- NIC -->
  <rect x="190" y="150" width="190" height="200" rx="8" fill="#e8eef8" stroke="#3a5a8c" stroke-width="1.5"/>
  <text x="285" y="174" text-anchor="middle" font-weight="bold">network card +</text>
  <text x="285" y="190" text-anchor="middle" font-weight="bold">storage controller</text>
  <text x="285" y="206" text-anchor="middle" font-size="11">nic.so (C), a d_cosim device</text>
  <text x="204" y="234" font-size="11">• epoll socket, frames requests</text>
  <text x="204" y="252" font-size="11">  (headers + Content-Length)</text>
  <text x="204" y="270" font-size="11">• bytes → pins, pins → bytes</text>
  <text x="204" y="288" font-size="11">• hands the chip's SQL to SQLite</text>
  <text x="204" y="306" font-size="11">• pulses rst between jobs</text>
  <text x="204" y="324" font-size="11">• branches only on the chip's</text>
  <text x="204" y="342" font-size="11">  first byte: ! answer, ? SQL</text>

  <!-- SQLite: its own box, outside the chip -->
  <rect x="40" y="370" width="200" height="74" rx="8" fill="#f0eaf6" stroke="#6b4a8c" stroke-width="1.5"/>
  <text x="140" y="392" text-anchor="middle" font-weight="bold">SQLite (feed.db)</text>
  <text x="140" y="409" text-anchor="middle" font-size="11">C library linked into nic.so</text>
  <text x="140" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b4a8c">not part of the chip</text>
  <text x="140" y="439" text-anchor="middle" font-size="10" fill="#555">runs the SQL the chip wrote</text>
  <line x1="285" y1="352" x2="210" y2="368" stroke="#6b4a8c" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="270" y="376" font-size="10" fill="#6b4a8c">SQL text / rows</text>

  <line x1="150" y1="285" x2="188" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- chip -->
  <rect x="440" y="80" width="300" height="480" rx="8" fill="#fbf1e6" stroke="#a5631f" stroke-width="1.5"/>
  <text x="590" y="104" text-anchor="middle" font-weight="bold">THE CHIP: top.v (Verilog, Verilator)</text>
  <text x="590" y="120" text-anchor="middle" font-size="11">a d_cosim device · core clock = 8 × board clock · no database inside</text>

  <rect x="460" y="134" width="120" height="44" rx="5" fill="#ffffff" stroke="#a5631f"/>
  <text x="520" y="153" text-anchor="middle" font-size="12">input FIFO</text>
  <text x="520" y="169" text-anchor="middle" font-size="11">8 B/clk → 1 B/cycle</text>
  <rect x="600" y="134" width="120" height="44" rx="5" fill="#ffffff" stroke="#a5631f"/>
  <text x="660" y="153" text-anchor="middle" font-size="12">output FIFO +</text>
  <text x="660" y="169" text-anchor="middle" font-size="11">64 KB body buffer</text>

  <rect x="460" y="196" width="260" height="290" rx="6" fill="#fff8ef" stroke="#a5631f"/>
  <text x="590" y="216" text-anchor="middle" font-weight="bold">core (chip.v)</text>
  <g font-size="11">
    <rect x="474" y="228" width="232" height="30" rx="4" fill="#ffffff" stroke="#c08a4f"/>
    <text x="590" y="247" text-anchor="middle">HTTP parser: method, route, id, Authorization</text>
    <rect x="474" y="264" width="113" height="44" rx="4" fill="#ffffff" stroke="#c08a4f"/>
    <text x="530" y="283" text-anchor="middle">JWT split +</text>
    <text x="530" y="298" text-anchor="middle">base64url</text>
    <rect x="593" y="264" width="113" height="44" rx="4" fill="#ffffff" stroke="#c08a4f"/>
    <text x="649" y="283" text-anchor="middle">HMAC-SHA256</text>
    <text x="649" y="298" text-anchor="middle">(sha256.v)</text>
    <rect x="474" y="314" width="232" height="44" rx="4" fill="#ffffff" stroke="#c08a4f"/>
    <text x="590" y="333" text-anchor="middle">streaming JSON validator / decoder (jscan.v)</text>
    <text x="590" y="348" text-anchor="middle">alg, exp, sub, username, post body</text>
    <rect x="474" y="364" width="232" height="30" rx="4" fill="#ffffff" stroke="#c08a4f"/>
    <text x="590" y="383" text-anchor="middle">SQL writer (quotes ')</text>
    <rect x="474" y="400" width="232" height="44" rx="4" fill="#ffffff" stroke="#c08a4f"/>
    <text x="590" y="419" text-anchor="middle">response programs (ROM): status, headers,</text>
    <text x="590" y="434" text-anchor="middle">Content-Length, rows → escaped JSON</text>
    <text x="590" y="470" text-anchor="middle" font-style="italic">phase A: request → "!" response or "?" SQL</text>
    <text x="590" y="484" text-anchor="middle" font-style="italic">phase B: SQLite rows → response</text>
  </g>
  <text x="590" y="510" text-anchor="middle" font-size="11">rst: power-cycle (fresh registers per job)</text>

  <!-- buses between nic and chip -->
  <line x1="382" y1="160" x2="458" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="411" y="152" text-anchor="middle" font-size="10">8 B in</text>
  <line x1="440" y1="186" x2="384" y2="186" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="411" y="202" text-anchor="middle" font-size="10">8 B out</text>
  <text x="411" y="224" text-anchor="middle" font-size="9" fill="#555">64-bit</text>
  <text x="411" y="235" text-anchor="middle" font-size="9" fill="#555">buses</text>
  <line x1="382" y1="440" x2="440" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="411" y="432" text-anchor="middle" font-size="11">rst</text>

  <!-- clock and power -->
  <rect x="190" y="460" width="190" height="96" rx="8" fill="#eef4ea" stroke="#4a6b3a"/>
  <text x="285" y="482" text-anchor="middle" font-weight="bold">clock + power-on</text>
  <text x="285" y="500" text-anchor="middle" font-size="11">ring oscillator: 1 NAND, 5 ns, fed</text>
  <text x="285" y="514" text-anchor="middle" font-size="11">back to itself → 100 MHz clk</text>
  <text x="285" y="532" text-anchor="middle" font-size="11">vdd ramp (analog) → ADC bridge → run</text>
  <text x="285" y="546" text-anchor="middle" font-size="11">(the board's only analog part)</text>

  <!-- comparator -->
  <rect x="775" y="200" width="150" height="230" rx="8" fill="#eef4ea" stroke="#4a6b3a" stroke-width="1.5"/>
  <text x="850" y="222" text-anchor="middle" font-weight="bold">signature</text>
  <text x="850" y="238" text-anchor="middle" font-weight="bold">comparator</text>
  <text x="850" y="254" text-anchor="middle" font-size="11">12 XSPICE gates</text>
  <g font-size="11">
    <text x="790" y="280">8 × XOR  (ca ≠ cb)</text>
    <text x="790" y="298">8-input OR</text>
    <text x="790" y="316">AND (hold unless cclr)</text>
    <text x="790" y="334">OR + D flip-flop → cbad</text>
    <text x="790" y="352">D flip-flop: cend → cack</text>
    <text x="790" y="380">one byte pair per</text>
    <text x="790" y="394">board clock; cbad = 1</text>
    <text x="790" y="408">means a bad signature</text>
  </g>
  <line x1="742" y1="280" x2="773" y2="280" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="757" y="272" text-anchor="middle" font-size="10">ca cb</text>
  <line x1="773" y1="340" x2="742" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="757" y="332" text-anchor="middle" font-size="10">cbad</text>

  <!-- clock lines -->
  <path d="M380,500 L760,500 L760,560 L850,560 L850,432" stroke="#4a6b3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <path d="M590,500 L590,488" stroke="#4a6b3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <path d="M300,460 L300,354" stroke="#4a6b3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="770" y="552" font-size="11" fill="#2f4a24">clk</text>
</svg>
