<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="CPU time per request, by version">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781}
  .grid{stroke:#e1e0d9} .axis{stroke:#c3c2b7} .ref{stroke:#52514e}
  .s1{stroke:#2a78d6} .f1{fill:#2a78d6} .s2{stroke:#eb6834} .f2{fill:#eb6834} .f1l{fill:#86b6ef}
