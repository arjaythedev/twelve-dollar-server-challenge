[project]
name = "twelve-dollar-dev"
version = "0.1.0"
description = "Tests and benchmarks for the native twelve-dollar server"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "psutil==7.2.2",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "types-psutil==7.2.2.20260906",
]

[tool.uv]
package = false
required-version = "==0.13.6"
link-mode = "copy"

[tool.pyright]
include = ["."]
exclude = [".venv", ".build", "runs", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN", "B", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Deterministic fixtures; SQL uses fixed fragments, validated integers and hex-encoded strings.
"tests/test_api.py" = ["S311", "S608"]
# Local tools run without a shell; the fixed /tmp path belongs to a disposable container.
"devtools/runtime.py" = ["S603", "S607", "S108"]
"devtools/checks.py" = ["S603", "S607", "S108"]

[tool.ruff.format]
line-ending = "lf"
