# Local capacity diagnostics without the Docker host's bridge/NAT conntrack cap.
# Clients join the server network namespace and use separate loopback sources.
services:
  seed:
    image: ${ADA_LOCAL_IMAGE}
    platform: ${ADA_SERVER_PLATFORM:-linux/amd64}
    network_mode: none
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        if [ ! -f /data/feed.db ]; then
          cp /seed/feed.db /data/feed.db
          chown 10001:10001 /data/feed.db
          chmod 640 /data/feed.db
        fi
        chown 10001:10001 /data
        chmod 750 /data
    volumes:
      - data:/data
      - ../../seed/feed.db:/seed/feed.db:ro
  server:
    image: ${ADA_LOCAL_IMAGE}
    platform: ${ADA_SERVER_PLATFORM:-linux/amd64}
    network_mode: none
    depends_on:
      seed:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      JWT_SECRET: twelve-dollar-challenge
      ADA_SERVE_MODE: direct
    volumes:
      - data:/data
volumes:
  data:
