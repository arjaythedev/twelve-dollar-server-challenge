[package]
name = "twelve-rust-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.4", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.47.1", features = ["rt", "net", "sync", "macros"] }
rusqlite = { version = "=0.37.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
