server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
# Serving directly means one keep-alive connection per client. Netty holds no
# buffers for an idle connection; the VPS's 65,535 open files bound their count.
server.netty.idle-timeout=70s
spring.web.resources.add-mappings=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.main.banner-mode=off
