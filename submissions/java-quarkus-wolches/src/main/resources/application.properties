# HTTP
quarkus.http.host=${HOST:0.0.0.0}
quarkus.http.port=${PORT:80}

# JWT
# Can be faster, but there is no other way available in quarkus to set up the proper response
quarkus.http.auth.proactive=false
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.publickey=NONE
mp.jwt.verify.issuer=NONE
smallrye.jwt.verify.secretkey={"kty":"oct","k":"dHdlbHZlLWRvbGxhci1jaGFsbGVuZ2U"}
smallrye.jwt.verify.require-iss=false
smallrye.jwt.claims.sub=true

# SQLite
# writer — default
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${SQLITE_PATH:feed.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=1
# readers
quarkus.datasource.readers.db-kind=sqlite
quarkus.datasource.readers.jdbc.url=jdbc:sqlite:${SQLITE_PATH:feed.db}?journal_mode=WAL&busy_timeout=5000&open_mode=1
quarkus.datasource.readers.jdbc.max-size=1
quarkus.datasource.readers.jdbc.min-size=1