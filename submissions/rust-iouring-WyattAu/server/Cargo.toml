[package]
name = "feed-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The $12 Server Challenge submission: five endpoints on sqlite-btree + uring-http"

[dependencies]
uring-http = { path = "../crates/uring-http" }
sqlite-btree = { path = "../crates/sqlite-btree" }
io-uring.workspace = true
libc.workspace = true
# F26 lever: hand-written SHA-NI kernels (runtime-detected via cpufeatures)
# — the HMAC-SHA256 verify runs once per authed request
sha2 = { version = "0.10", features = ["asm"] }
rusqlite = { workspace = true, features = ["bundled"] }
uring-kit.workspace = true
hmac = "0.12"
base64 = "0.22"
