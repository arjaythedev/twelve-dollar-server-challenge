[package]
name = "feed-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "=0.23.1"
hmac = "=0.13.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net"] }

[profile.release]
codegen-units = 1
lto = "thin"
