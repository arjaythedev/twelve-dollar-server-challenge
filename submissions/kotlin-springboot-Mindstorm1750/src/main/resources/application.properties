spring.application.name=feed
spring.main.banner-mode=off

# Runtime contract (SPEC.md): HOST, PORT, SQLITE_PATH, JWT_SECRET.
server.address=${HOST:0.0.0.0}
server.port=${PORT:80}
feed.sqlite-path=${SQLITE_PATH}
feed.jwt-secret=${JWT_SECRET}

# Serving directly: every user holds a keep-alive connection, so allow far more than the expected ~15k
# (the service gets LimitNOFILE=65535), and keep idle ones open well past Nginx-style 65 s.
server.tomcat.max-connections=60000
server.tomcat.accept-count=1024
server.tomcat.keep-alive-timeout=75s
server.tomcat.max-keep-alive-requests=-1
spring.threads.virtual.enabled=true

# Unknown paths raise NoHandlerFoundException (mapped to 404 {"error":"not found"}) instead of static lookup.
spring.web.resources.add-mappings=false
# Every error body comes from ApiExceptionHandler; Boot's /error controller can't render without Jackson, and
# without it /error is just another unknown path (404 {"error":"not found"}).
spring.autoconfigure.exclude=org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration

# Filters this API doesn't need on every request: no form-encoded bodies, and JSON is always UTF-8.
spring.mvc.formcontent.filter.enabled=false
spring.servlet.encoding.enabled=false

spring.kotlinx.serialization.json.ignore-unknown-keys=true
spring.kotlinx.serialization.json.explicit-nulls=false
