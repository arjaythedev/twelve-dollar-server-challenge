[package]
name = "twelve-dollar-mq-bridge"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone, not part of any surrounding workspace.
[workspace]

[dependencies]
mq-bridge = { version = "=1.3.0", default-features = false, features = ["http", "sqlx"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
async-trait = "=0.1.92"
serde_json = "=1.0.154"
hmac = "=0.13.0"
sha2 = "=0.11.1"
base64 = "=0.23.1"
mimalloc = { version = "=0.1.52", default-features = false }

[profile.release]
lto = "thin"
