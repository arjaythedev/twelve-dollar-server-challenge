; Loaded with `php -c php.ini`; the distro's conf.d still loads the sqlite3/opcache modules.
memory_limit = 512M
display_errors = stderr
log_errors = Off
error_reporting = E_ALL
zend.assertions = -1
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M
