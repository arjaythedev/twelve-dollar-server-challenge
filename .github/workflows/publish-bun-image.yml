name: publish Bun image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and determine image name
        id: image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag (use 1–128 letters, digits, underscores, periods or hyphens; do not start with a period or hyphen)."
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/javascript-bun-zxmpg41" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./submissions/javascript-bun-zxmpg41
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
        run: |
          printf '### Published image\n\n```sh\ndocker pull %s\n```\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
